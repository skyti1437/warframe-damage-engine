[package]
name = "tiny_http"
version = "0.12.0"
edition = "2018"
license = "MIT OR Apache-2.0"
repository = "https://github.com/tiny-http/tiny-http"
publish = false

[dependencies]
ascii = "1.0"
chunked_transfer = "1"
httpdate = "1.0.2"
log = "0.4.4"

[features]
default = []

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(feature, values("ssl", "ssl-openssl", "ssl-rustls"))'] }
