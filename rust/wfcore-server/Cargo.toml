[package]
name = "wfcore-server"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
wfcore-lib = { path = "../wfcore-lib" }
indexmap = "=2.14.2"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order", "float_roundtrip"] }
tiny_http = "0.12"
